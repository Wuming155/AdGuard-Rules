name: Update Rules and README

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00 = 中国 09:00
  workflow_dispatch:      # 允许手动在 GitHub 页面点击运行
  push:
    paths:
      - 'sources_adguard.txt'
      - 'sources_host.txt'
      - 'main_executor.py'
      - 'custom-rules/**'
      - 'src/**'           # 代码修改后自动重新生成
      - '.github/workflows/*.yml'  # 工作流配置变更后触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史，解决 pull --rebase 冲突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        run: python main_executor.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          # 强制添加 dist/ 下的新文件（mihomo_rules.txt 等首次出现时会被 gitignore 屏蔽）
          git add -f dist/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto Update Stats: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            
            # 拉取远程最新代码并 rebase，避免推送冲突
            # 若 rebase 冲突则放弃 rebase，以本地最新生成结果进行强制推送
            if git pull --rebase origin main; then
              git push origin main
            else
              git rebase --abort
              echo "Rebase 冲突，以本地结果为基准进行推送"
              git push --force-with-lease origin main
            fi
          else
            echo "No changes detected, skipping commit."
          fi