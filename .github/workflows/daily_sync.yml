name: Update Rules and README

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00 = 中国 09:00
  workflow_dispatch:      # 允许手动在 GitHub 页面点击运行
  push:
    paths:
      - 'sources/**'
      - 'main_executor.py'
      - 'custom-rules/**'
      - 'src/**'           # 代码修改后自动重新生成
      - '.github/workflows/*.yml'  # 工作流配置变更后触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推送自动生成的规则文件需要写权限
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史，解决 pull --rebase 冲突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        run: python main_executor.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # dist/ 已被 .gitignore 忽略：规则文件不进 git 仓库（避免仓库膨胀），
          # 改为在下一步以 Release 附件形式分发
          git add .
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto Update Stats: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            
            # 拉取远程最新代码并 rebase，避免推送冲突
            # 若 rebase 冲突则放弃 rebase，以本地最新生成结果进行强制推送
            if git pull --rebase origin main; then
              git push origin main
            else
              echo "::warning::Rebase 失败，尝试中止后以本地结果强制推送"
              git rebase --abort 2>/dev/null || true
              git push --force-with-lease origin main
            fi
          else
            echo "No changes detected, skipping commit."
          fi

      - name: Publish Rule Files to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=rules

          # tag 始终指向当前 main：monthly_cleanup 重写历史后，旧的 tag 指向会失效
          git tag -f "$TAG"
          git push -f origin "$TAG"

          # 固定 tag：附件每天被同名覆盖，Release 体积恒定，下载地址永久有效
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.txt --clobber
          else
            gh release create "$TAG" \
              --title "AdGuard 过滤规则" \
              --notes "每日自动更新的规则文件，附件始终为最新一次生成结果（同名附件会被覆盖）。" \
              dist/*.txt
          fi
          gh release edit "$TAG" --latest